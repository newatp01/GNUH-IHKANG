{% extends "base.html" %}
{% block title %}{{ post.title }} - 강정훈 연구 사이트{% endblock %}
{% block content %}
<section class="card">
  <div class="card-head">
    <p class="card-title">{{ post.title }}</p>
    <a href="{{ url_for('board') }}" class="ghost-btn">목록으로</a>
  </div>
  <p class="muted small-text">{{ post.author }} · {{ post.created_at[:16].replace('T',' ') }}</p>
  <p class="post-body">{{ post.content }}</p>
</section>
{% endblock %}
