{% extends "base.html" %}
{% block title %}관리자 로그인 - 강정훈 연구 사이트{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <p class="auth-title">강정훈 (관리자)</p>
    <p class="auth-sub">관리자 비밀번호를 입력해주세요.</p>
    {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="password" name="password" placeholder="관리자 비밀번호" autofocus required>
      <button type="submit" class="primary">입장하기</button>
    </form>
    <p class="auth-sub" style="margin-top:14px;"><a href="{{ url_for('select_name') }}">다른 이름으로 돌아가기</a></p>
  </div>
</div>
{% endblock %}
